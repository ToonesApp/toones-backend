services:
  - type: web
    name: toones-api
    runtime: node
    plan: free
    # --include=dev because tsc is a devDependency and hosts often set NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Render injects PORT itself; src/config/env.ts already reads it.
      # Secrets are set in the dashboard, never committed here.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
